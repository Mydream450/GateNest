
name: Build GateNest APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Supabase source
        run: |
          unzip -q GateNest_Supabase_Starter_Source.zip -d extracted
          find extracted -name pubspec.yaml -print

      - name: Locate Flutter app
        run: |
          APP_DIR="$(dirname "$(find extracted -name pubspec.yaml -print -quit)")"
          test -n "$APP_DIR"
          mkdir app
          cp -a "$APP_DIR"/. app/

      - name: Create Android project
        working-directory: app
        run: flutter create --platforms=android --project-name gatenest .

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GateNest-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
